<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#875A7B"/>
      <stop offset="100%" style="stop-color:#68495f"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="128" height="128" rx="20" fill="url(#bg)"/>
  <!-- Left arrow (outgoing) -->
  <g fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Bank icon left -->
    <rect x="15" y="40" width="35" height="30" rx="3"/>
    <line x1="15" y1="50" x2="50" y2="50"/>
    <line x1="22" y1="55" x2="22" y2="65"/>
    <line x1="32" y1="55" x2="32" y2="65"/>
    <line x1="42" y1="55" x2="42" y2="65"/>
    <!-- Bank icon right -->
    <rect x="78" y="40" width="35" height="30" rx="3"/>
    <line x1="78" y1="50" x2="113" y2="50"/>
    <line x1="85" y1="55" x2="85" y2="65"/>
    <line x1="95" y1="55" x2="95" y2="65"/>
    <line x1="105" y1="55" x2="105" y2="65"/>
    <!-- Arrows -->
    <path d="M55 52 L73 52" stroke-width="3"/>
    <polyline points="68,47 73,52 68,57" stroke-width="3"/>
    <path d="M73 58 L55 58" stroke-width="3"/>
    <polyline points="60,53 55,58 60,63" stroke-width="3"/>
  </g>
  <!-- Checkmark circle -->
  <circle cx="100" cy="28" r="14" fill="#28a745"/>
  <polyline points="93,28 98,33 108,23" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bottom text -->
  <text x="64" y="98" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">TRANSFER</text>
</svg>
